</defs><rect width="720" height="356" fill="#fff"/><text x="360" y="26" font-size="17" fill="#3B0136" text-anchor="middle" font-weight="700">Ecuación de Einstein: más partículas, más viscosidad</text><rect x="70" y="60" width="102.5" height="210" rx="0" fill="#E3F1EC" stroke="none" stroke-width="1.5"/><text x="121.25" y="78" font-size="12.5" fill="#337561" text-anchor="middle" font-weight="700">diluido</text><line x1="70" y1="270" x2="495" y2="270" stroke="#1F2937" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><line x1="70" y1="270" x2="70" y2="56" stroke="#1F2937" stroke-width="2" marker-end="url(#ar)" stroke-linecap="round"/><text x="66" y="50" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="700">η / η₀</text><text x="494" y="312" font-size="12.5" fill="#1F2937" text-anchor="end" font-weight="700">fracción de volumen de sólido φ</text><line x1="70" y1="266" x2="70" y2="274" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="70" y="290" font-size="11.5" fill="#1F2937" text-anchor="middle">0</text><line x1="172.5" y1="266" x2="172.5" y2="274" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="172.5" y="290" font-size="11.5" fill="#1F2937" text-anchor="middle">0,1</text><line x1="275" y1="266" x2="275" y2="274" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="275" y="290" font-size="11.5" fill="#1F2937" text-anchor="middle">0,2</text><line x1="377.49999999999994" y1="266" x2="377.49999999999994" y2="274" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="377.49999999999994" y="290" font-size="11.5" fill="#1F2937" text-anchor="middle">0,3</text><line x1="480" y1="266" x2="480" y2="274" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="480" y="290" font-size="11.5" fill="#1F2937" text-anchor="middle">0,4</text><polyline fill="none" stroke="#A8009C" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"  points="70.0,270.0 76.8,269.0 83.7,268.0
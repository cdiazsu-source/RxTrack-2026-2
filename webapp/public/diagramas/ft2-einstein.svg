70.0 475.9,70.0 480.0,70.0"/><text x="476" y="243.52941176470588" font-size="12.5" fill="#A8009C" text-anchor="end" font-weight="700">Einstein: η = η₀(1 + 2,5φ)</text><text x="476" y="140.47058823529414" font-size="12.5" fill="#6B7280" text-anchor="end" font-weight="700">realidad (concentrado): se dispara</text><rect x="515" y="90" width="185" height="150" rx="8" fill="#FBF4FA" stroke="#A8009C" stroke-width="1.5"/><text x="528" y="114" font-size="12.5" fill="#3B0136" text-anchor="start" font-weight="700">Ejemplo:</text><text x="528" y="134" font-size="12.5" fill="#3B0136" text-anchor="start" font-weight="700">φ = 0,05 (5 % del</text><text x="528" y="154" font-size="12.5" fill="#3B0136" text-anchor="start" font-weight="700">volumen es sólido)</text><text x="528" y="174" font-size="12.5" fill="#3B0136" text-anchor="start" font-weight="700">η = η₀(1 + 2,5·0,05)</text><text x="528" y="194" font-size="12.5" fill="#3B0136" text-anchor="start" font-weight="700">η = 1,125 η₀</text><text x="528" y="214" font-size="12.5" fill="#3B0136" text-anchor="start" font-weight="700">→ sube solo 12,5 %</text><text x="360" y="340" font-size="12.5" fill="#6B7280" text-anchor="middle">Solo vale para esferas rígidas, diluidas y sin interacción. Por eso es un punto de partida, no la historia completa.</text></svg>

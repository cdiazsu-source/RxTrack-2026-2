223" font-size="12.5" fill="#C53030" text-anchor="start" font-weight="700">V_m  barrera de repulsión</text><text x="238.5" y="101.28358208955223" font-size="12.5" fill="#C53030" text-anchor="start" font-weight="700">partículas SEPARADAS (defloculadas)</text><circle cx="374.32500000000005" cy="250.41677100203725" r="7" fill="#337561" stroke="none" stroke-width="1.5"/><line x1="374.32500000000005" y1="259.41677100203725" x2="374.32500000000005" y2="294.41677100203725" stroke="#337561" stroke-width="1.5" stroke-linecap="round"/><text x="374.32500000000005" y="310.41677100203725" font-size="12.5" fill="#337561" text-anchor="middle" font-weight="700">V_t  mínimo SECUNDARIO</text><text x="374.32500000000005" y="326.41677100203725" font-size="12.5" fill="#337561" text-anchor="middle" font-weight="700">atracción débil y reversible</text><text x="374.32500000000005" y="342.41677100203725" font-size="12.5" fill="#337561" text-anchor="middle" font-weight="700">→ FLOCULACIÓN CONTROLADA ✔</text><circle cx="86.1" cy="380.17910447761193" r="7" fill="#C53030" stroke="none" stroke-width="1.5"/><text x="113.55000000000001" y="331.97014925373134" font-size="12.5" fill="#C53030" text-anchor="start" font-weight="700">V_p  mínimo PRIMARIO</text><text x="113.55000000000001" y="347.97014925373134" font-size="12.5" fill="#C53030" text-anchor="start" font-weight="700">contacto íntimo, irreversible</text><text x="113.55000000000001" y="363.97014925373134" font-size="12.5" fill="#C53030" text-anchor="start" font-weight="700">→ CEMENTACIÓN (caking) ✖</text><text x="360" y="414" font-size="12" fill="#6B7280" text-anchor="middle">Analogía: una pelota que rueda sobre una colina con un hoyito poco profundo (Vt) y un pozo profundo al pie (Vp).</text><text x="360" y="429" font-size="12" fill="#6B7280" text-anchor="middle">Queremos que se quede en el hoyito: se puede sacar con una sacudida; del pozo no sale.</text></svg>

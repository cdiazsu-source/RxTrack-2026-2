<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="720" height="456" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif"><title id="t">Mapa de la formulación de una suspensión</title><desc id="d">Ocho funciones de una suspensión de sulfametazina: fármaco, humectante, suspensores, protección contra el caking, vehículo, conservantes, estabilidad química y aceptabilidad, alrededor de la suspensión terminada.</desc><defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1F2937"/></marker>
<marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#A8009C"/></marker>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#C53030"/></marker>
</defs><rect width="720" height="456" fill="#fff"/><text x="360" y="26" font-size="17" fill="#3B0136" text-anchor="middle" font-weight="700">Anatomía de una suspensión: cada ingrediente tiene un trabajo</text><rect x="18" y="48" width="226" height="88" rx="8" fill="#F7E6F5" stroke="#A8009C" stroke-width="2"/><text x="30" y="70" font-size="13" fill="#A8009C" text-anchor="start" font-weight="700">1 · EL FÁRMACO (fase dispersa)</text><text x="30" y="89" font-size="11.5" fill="#1F2937" text-anchor="start">Sulfametazina: insoluble en agua</text><text x="30" y="104" font-size="11.5" fill="#1F2937" text-anchor="start">y hidrófoba. Micronizada (1–50 µm):</text><text x="30" y="119" font-size="11.5" fill="#1F2937" text-anchor="start">menos arenosa, cae más lento.</text><rect x="18" y="142" width="226" height="88" rx="8" fill="#E3EEF9" stroke="#2B6CB0" stroke-width="2"/><text x="30" y="164" font-size="13" fill="#2B6CB0" text-anchor="start" font-weight="700">2 · MOJARLO</text><text x="30" y="183" font-size="11.5" fill="#1F2937" text-anchor="start">Span 20 (HLB ≈ 8,6): baja el ángulo</text><text x="30" y="198" font-size="11.5" fill="#1F2937" text-anchor="start">de contacto; el polvo ya no flota</text><text x="30" y="213" font-size="11.5" fill="#1F2937" text-anchor="start">ni hace grumos.</text><rect x="18" y="236" width="226" height="88" rx="8" fill="#FDF0D5" stroke="#B45F06" stroke-width="2"/><text x="30" y="258" font-size="13" fill="#B45F06" text-anchor="start" font-weight="700">3 · SUSPENDERLO</text><text x="30" y="277" font-size="11.5" fill="#1F2937" text-anchor="start">Veegum: castillo de naipes, tixotrópico.</text><text x="30" y="292" font-size="11.5" fill="#1F2937" text-anchor="start">CMC: sube η (Stokes: cae más lento).</text><text x="30" y="307" font-size="11.5" fill="#1F2937" text-anchor="start">Trabajan en sinergia.</text><rect x="18" y="330" width="226" height="88" rx="8" fill="#FBE4E4" stroke="#C53030" stroke-width="2"/><text x="30" y="352" font-size="13" fill="#C53030" text-anchor="start" font-weight="700">4 · EVITAR EL CAKING</text><text x="30" y="371" font-size="11.5" fill="#1F2937" text-anchor="start">CMC como coloide protector (carga −</text><text x="30" y="386" font-size="11.5" fill="#1F2937" text-anchor="start">y barrera estérica). Si hace falta,</text><text x="30" y="401" font-size="11.5" fill="#1F2937" text-anchor="start">floculación controlada con electrolito.</text><rect x="476" y="48" width="226" height="88" rx="8" fill="#E3F1EC" stroke="#337561" stroke-width="2"/><text x="488" y="70" font-size="13" fill="#337561" text-anchor="start" font-weight="700">5 · EL VEHÍCULO</text><text x="488" y="89" font-size="11.5" fill="#1F2937" text-anchor="start">Agua purificada: disuelve lo soluble</text><text x="488" y="104" font-size="11.5" fill="#1F2937" text-anchor="start">e hidrata Veegum y CMC. Calidad</text><text x="488" y="119" font-size="11.5" fill="#1F2937" text-anchor="start">farmacopeica.</text><rect x="476" y="142" width="226" height="88" rx="8" fill="#F7E6F5" stroke="#3B0136" stroke-width="2"/><text x="488" y="164" font-size="13" fill="#3B0136" text-anchor="start" font-weight="700">6 · CONSERVARLO</text><text x="488" y="183" font-size="11.5" fill="#1F2937" text-anchor="start">Metil + propilparabeno (3:1 a 4:1):</text><text x="488" y="198" font-size="11.5" fill="#1F2937" text-anchor="start">bacterias y hongos. La eficacia</text><text x="488" y="213" font-size="11.5" fill="#1F2937" text-anchor="start">depende del pH.</text><rect x="476" y="236" width="226" height="88" rx="8" fill="#E3EEF9" stroke="#2B6CB0" stroke-width="2"/><text x="488" y="258" font-size="13" fill="#2B6CB0" text-anchor="start" font-weight="700">7 · ESTABILIDAD QUÍMICA</text><text x="488" y="277" font-size="11.5" fill="#1F2937" text-anchor="start">Buffer / ajuste de pH y antioxidante</text><text x="488" y="292" font-size="11.5" fill="#1F2937" text-anchor="start">(catálisis ácido-base específica</text><text x="488" y="307" font-size="11.5" fill="#1F2937" text-anchor="start">frente a general).</text><rect x="476" y="330" width="226" height="88" rx="8" fill="#E3F1EC" stroke="#337561" stroke-width="2"/><text x="488" y="352" font-size="13" fill="#337561" text-anchor="start" font-weight="700">8 · QUE SE PUEDA TOMAR</text><text x="488" y="371" font-size="11.5" fill="#1F2937" text-anchor="start">Sacarosa: cuerpo y mayor densidad</text><text x="488" y="386" font-size="11.5" fill="#1F2937" text-anchor="start">del medio. Sacarina: dulzor potente.</text><text x="488" y="401" font-size="11.5" fill="#1F2937" text-anchor="start">Menta: sabor y adherencia.</text><rect x="262" y="190" width="196" height="100" rx="12" fill="#3B0136" stroke="none" stroke-width="1.5"/><text x="360" y="224" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">SUSPENSIÓN</text><text x="360" y="244" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">de sulfametazina</text><text x="360" y="264" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">estable y dosificable</text><line x1="246" y1="92" x2="262" y2="240" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/><line x1="246" y1="186" x2="262" y2="240" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/><line x1="246" y1="280" x2="262" y2="240" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/><line x1="246" y1="374" x2="262" y2="240" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/><line x1="474" y1="92" x2="458" y2="240" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/><line x1="474" y1="186" x2="458" y2="240" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/><line x1="474" y1="280" x2="458" y2="240" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/><line x1="474" y1="374" x2="458" y2="240" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/><text x="360" y="438" font-size="12.5" fill="#3B0136" text-anchor="middle" font-weight="700">Estabilidad FÍSICA (2, 3, 4) · QUÍMICA (7) · MICROBIOLÓGICA (6) · ACEPTABILIDAD / VÍA (8)</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif"><title id="t">Efecto de cada variable en la velocidad de sedimentación</title><desc id="d">Barras en escala logarítmica con el factor por el que cambia la velocidad de sedimentación al cambiar el tamaño, la viscosidad o la diferencia de densidad.</desc><defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1F2937"/></marker>
<marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#A8009C"/></marker>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#C53030"/></marker>
</defs><rect width="720" height="396" fill="#fff"/><text x="360" y="26" font-size="17" fill="#3B0136" text-anchor="middle" font-weight="700">Ley de Stokes: ¿cuánto cambia la velocidad de caída?</text><text x="360" y="46" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="700">v  =  2 r² (ρ_partícula − ρ_medio) g  /  9 η</text><line x1="596.6666666666666" y1="64" x2="596.6666666666666" y2="328" stroke="#1F2937" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><text x="596.6666666666666" y="62" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="700">punto de partida = 1</text><text x="20" y="102" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="700">Duplicar el tamaño (d × 2)</text><rect x="596.6666666666666" y="86" width="80.27466551039504" height="24" rx="3" fill="#C53030" stroke="none" stroke-width="1.5"/><text x="684.9413321770617" y="103" font-size="13" fill="#C53030" text-anchor="start" font-weight="700">× 4</text><text x="20" y="144" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="700">Duplicar la viscosidad (η × 2)</text><rect x="556.5293339114692" y="128" width="40.13733275519746" height="24" rx="3" fill="#337561" stroke="none" stroke-width="1.5"/><text x="548.5293339114692" y="145" font-size="13" fill="#337561" text-anchor="end" font-weight="700">× 0,5</text><text x="20" y="186" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="700">Reducir a la mitad Δρ (sacarosa)</text><rect x="556.5293339114692" y="170" width="40.13733275519746" height="24" rx="3" fill="#337561" stroke="none" stroke-width="1.5"/><text x="548.5293339114692" y="187" font-size="13" fill="#337561" text-anchor="end" font-weight="700">× 0,5</text><text x="20" y="228" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="700">Reducir a la mitad el tamaño</text><rect x="516.3920011562717" y="212" width="80.27466551039493" height="24" rx="3" fill="#337561" stroke="none" stroke-width="1.5"/><text x="508.3920011562717" y="229" font-size="13" fill="#337561" text-anchor="end" font-weight="700">× 0,25</text><text x="20" y="270" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="700">Subir η ×10 (gel suspensor)</text><rect x="463.3333333333333" y="254" width="133.33333333333331" height="24" rx="3" fill="#337561" stroke="none" stroke-width="1.5"/><text x="455.3333333333333" y="271" font-size="13" fill="#337561" text-anchor="end" font-weight="700">× 0,1</text><text x="20" y="312" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="700">Micronizar: tamaño ÷ 10</text><rect x="330" y="296" width="266.66666666666663" height="24" rx="3" fill="#337561" stroke="none" stroke-width="1.5"/><text x="322" y="313" font-size="13" fill="#337561" text-anchor="end" font-weight="700">× 0,01</text><text x="423.3333333333333" y="342" font-size="12.5" fill="#337561" text-anchor="middle" font-weight="700">← cae más lento (más estable)</text><text x="636.6666666666666" y="342" font-size="12.5" fill="#C53030" text-anchor="middle" font-weight="700">más rápido →</text><text x="360" y="382" font-size="12.5" fill="#3B0136" text-anchor="middle" font-weight="700">El tamaño pega al CUADRADO: es la palanca más potente. Micronizar gana 100×; duplicar la viscosidad, solo 2×.</text></svg>

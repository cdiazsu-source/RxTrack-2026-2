<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif"><title id="t">Ángulo de contacto y humectación</title><desc id="d">Gota sobre un sólido hidrófobo con un ángulo de contacto mayor de 90 grados y la misma gota con un tensioactivo adsorbido que baja el ángulo; ecuación de Young.</desc><defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1F2937"/></marker>
<marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#A8009C"/></marker>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#C53030"/></marker>
</defs><rect width="720" height="372" fill="#fff"/><text x="360" y="26" font-size="17" fill="#3B0136" text-anchor="middle" font-weight="700">Humectar: bajar el ángulo de contacto (θ)</text><rect x="30" y="236" width="310" height="20" rx="2" fill="#9CA3AF" stroke="none" stroke-width="1.5"/><text x="185" y="251" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">sólido hidrófobo (sulfametazina)</text><path d="M123,236 A75.68802450321026,75.68802450321026 0 1 1 247,236 Z" fill="#CFE4F7" stroke="#2B6CB0" stroke-width="3"/><line x1="123" y1="236" x2="82.8496494554268" y2="178.65935689977056" stroke="#C53030" stroke-width="2.5" stroke-linecap="round"/><line x1="113" y1="236" x2="185" y2="236" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><path d="M157,236 A34,34 0 0 0 103.49840116406445,208.14883049417426" fill="none" stroke="#C53030" stroke-width="2.5"/><text x="185" y="158" font-size="14" fill="#C53030" text-anchor="middle" font-weight="700">θ ≈ 125°  (&gt; 90°)</text><text x="185" y="284" font-size="13" fill="#C53030" text-anchor="middle" font-weight="700">SIN humectante: el agua no moja,</text><text x="185" y="301" font-size="13" fill="#C53030" text-anchor="middle" font-weight="700">el polvo atrapa aire y FLOTA ✖</text><rect x="380" y="236" width="310" height="20" rx="2" fill="#9CA3AF" stroke="none" stroke-width="1.5"/><text x="535" y="251" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">mismo sólido + Span 20 adsorbido</text><path d="M435,236 A162.42692454827443,162.42692454827443 0 0 1 635,236 Z" fill="#CFE4F7" stroke="#2B6CB0" stroke-width="3"/><line x1="435" y1="236" x2="490.16075275247056" y2="192.90369672720394" stroke="#C53030" stroke-width="2.5" stroke-linecap="round"/><line x1="425" y1="236" x2="497" y2="236" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><path d="M469,236 A34,34 0 0 0 461.79236562262855,215.0675098389276" fill="none" stroke="#C53030" stroke-width="2.5"/><text x="535" y="158" font-size="14" fill="#337561" text-anchor="middle" font-weight="700">θ ≈ 38°  (&lt; 90°)</text><text x="535" y="284" font-size="13" fill="#337561" text-anchor="middle" font-weight="700">CON humectante: el agua penetra,</text><text x="535" y="301" font-size="13" fill="#337561" text-anchor="middle" font-weight="700">desplaza el aire y se dispersa ✔</text><line x1="445" y1="238" x2="445" y2="224" stroke="#A8009C" stroke-width="2" stroke-linecap="round"/><circle cx="445" cy="220" r="3.6" fill="#A8009C" stroke="none" stroke-width="1.5"/><line x1="456" y1="238" x2="456" y2="224" stroke="#A8009C" stroke-width="2" stroke-linecap="round"/><circle cx="456" cy="220" r="3.6" fill="#A8009C" stroke="none" stroke-width="1.5"/><line x1="467" y1="238" x2="467" y2="224" stroke="#A8009C" stroke-width="2" stroke-linecap="round"/><circle cx="467" cy="220" r="3.6" fill="#A8009C" stroke="none" stroke-width="1.5"/><line x1="478" y1="238" x2="478" y2="224" stroke="#A8009C" stroke-width="2" stroke-linecap="round"/><circle cx="478" cy="220" r="3.6" fill="#A8009C" stroke="none" stroke-width="1.5"/><line x1="489" y1="238" x2="489" y2="224" stroke="#A8009C" stroke-width="2" stroke-linecap="round"/><circle cx="489" cy="220" r="3.6" fill="#A8009C" stroke="none" stroke-width="1.5"/><line x1="500" y1="238" x2="500" y2="224" stroke="#A8009C" stroke-width="2" stroke-linecap="round"/><circle cx="500" cy="220" r="3.6" fill="#A8009C" stroke="none" stroke-width="1.5"/><line x1="511" y1="238" x2="511" y2="224" stroke="#A8009C" stroke-width="2" stroke-linecap="round"/><circle cx="511" cy="220" r="3.6" fill="#A8009C" stroke="none" stroke-width="1.5"/><line x1="522" y1="238" x2="522" y2="224" stroke="#A8009C" stroke-width="2" stroke-linecap="round"/><circle cx="522" cy="220" r="3.6" fill="#A8009C" stroke="none" stroke-width="1.5"/><line x1="533" y1="238" x2="533" y2="224" stroke="#A8009C" stroke-width="2" stroke-linecap="round"/><circle cx="533" cy="220" r="3.6" fill="#A8009C" stroke="none" stroke-width="1.5"/><text x="535" y="182" font-size="11.5" fill="#A8009C" text-anchor="middle" font-weight="700">cola (lipófila) al sólido, cabeza (hidrófila) al agua</text><text x="360" y="338" font-size="15" fill="#3B0136" text-anchor="middle" font-weight="700">Young:   cos θ = ( γ_SV − γ_SL ) / γ_LV</text><text x="360" y="358" font-size="12.5" fill="#3B0136" text-anchor="middle">Span 20 baja γ_SL  →  cos θ sube  →  θ baja  →  el líquido moja</text></svg>

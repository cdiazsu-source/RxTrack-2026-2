<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif"><title id="t">Escala de tamaños de partícula</title><desc id="d">Escala logarítmica desde 0,1 nm hasta 1 mm: solución verdadera, zona gris, coloide (10 a 1000 nm) y suspensión gruesa, con ejemplos.</desc><defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1F2937"/></marker>
<marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#A8009C"/></marker>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#C53030"/></marker>
</defs><rect width="720" height="372" fill="#fff"/><text x="360" y="28" font-size="17" fill="#3B0136" text-anchor="middle" font-weight="700">¿De qué tamaño es un coloide? (escala logarítmica)</text><text x="360" y="48" font-size="13" fill="#6B7280" text-anchor="middle">Cada marca es 10 veces mayor que la anterior</text><rect x="40" y="78" width="92.85714285714283" height="52" rx="4" fill="#E3F1EC" stroke="#337561" stroke-width="2"/><text x="86.42857142857142" y="110" font-size="13" fill="#337561" text-anchor="middle" font-weight="700">Solución</text><rect x="132.85714285714283" y="78" width="92.85714285714286" height="52" rx="4" fill="#F7E6F5" stroke="#A8009C" stroke-width="2" stroke-dasharray="6 4"/><text x="179.28571428571428" y="110" font-size="13" fill="#A8009C" text-anchor="middle" font-weight="700">zona gris</text><rect x="225.7142857142857" y="78" width="185.7142857142857" height="52" rx="4" fill="#EBBDE6" stroke="#A8009C" stroke-width="2"/><text x="318.57142857142856" y="110" font-size="13" fill="#3B0136" text-anchor="middle" font-weight="700">COLOIDE</text><rect x="411.4285714285714" y="78" width="278.5714285714286" height="52" rx="4" fill="#FDF0D5" stroke="#B45F06" stroke-width="2"/><text x="550.7142857142857" y="110" font-size="13" fill="#B45F06" text-anchor="middle" font-weight="700">Suspensión gruesa</text><text x="179.28571428571428" y="70" font-size="12" fill="#A8009C" text-anchor="middle">1–10 nm</text><text x="318.57142857142856" y="70" font-size="12" fill="#3B0136" text-anchor="middle" font-weight="700">10 – 1000 nm (lo que vimos en clase)</text><line x1="40" y1="160" x2="690" y2="160" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><line x1="40" y1="155" x2="40" y2="165" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="40" y="182" font-size="12" fill="#1F2937" text-anchor="middle">0,1 nm</text><line x1="132.85714285714283" y1="155" x2="132.85714285714283" y2="165" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="132.85714285714283" y="182" font-size="12" fill="#1F2937" text-anchor="middle">1 nm</text><line x1="225.7142857142857" y1="155" x2="225.7142857142857" y2="165" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="225.7142857142857" y="182" font-size="12" fill="#1F2937" text-anchor="middle">10 nm</text><line x1="318.57142857142856" y1="155" x2="318.57142857142856" y2="165" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="318.57142857142856" y="182" font-size="12" fill="#1F2937" text-anchor="middle">100 nm</text><line x1="411.4285714285714" y1="155" x2="411.4285714285714" y2="165" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="411.4285714285714" y="182" font-size="12" fill="#1F2937" text-anchor="middle">1 µm</text><line x1="504.2857142857143" y1="155" x2="504.2857142857143" y2="165" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="504.2857142857143" y="182" font-size="12" fill="#1F2937" text-anchor="middle">10 µm</text><line x1="597.1428571428571" y1="155" x2="597.1428571428571" y2="165" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="597.1428571428571" y="182" font-size="12" fill="#1F2937" text-anchor="middle">100 µm</text><line x1="690" y1="155" x2="690" y2="165" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/><text x="690" y="182" font-size="12" fill="#1F2937" text-anchor="middle">1 mm</text><line x1="67.85714285714286" y1="190" x2="67.85714285714286" y2="186" stroke="#337561" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="67.85714285714286" cy="160" r="5" fill="#337561" stroke="none" stroke-width="1.5"/><text x="67.85714285714286" y="200" font-size="13" fill="#337561" text-anchor="middle" font-weight="700">Ion Na⁺</text><line x1="128.21428571428572" y1="190" x2="128.21428571428572" y2="218" stroke="#337561" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="128.21428571428572" cy="160" r="5" fill="#337561" stroke="none" stroke-width="1.5"/><text x="128.21428571428572" y="232" font-size="13" fill="#337561" text-anchor="middle" font-weight="700">Glucosa</text><line x1="197.85714285714286" y1="190" x2="197.85714285714286" y2="250" stroke="#A8009C" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="197.85714285714286" cy="160" r="5" fill="#A8009C" stroke="none" stroke-width="1.5"/><text x="197.85714285714286" y="264" font-size="13" fill="#A8009C" text-anchor="middle" font-weight="700">Micela (≈5 nm)</text><line x1="318.57142857142856" y1="190" x2="318.57142857142856" y2="186" stroke="#A8009C" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="318.57142857142856" cy="160" r="5" fill="#A8009C" stroke="none" stroke-width="1.5"/><text x="318.57142857142856" y="200" font-size="13" fill="#A8009C" text-anchor="middle" font-weight="700">Virus (≈100 nm)</text><line x1="490.35714285714283" y1="190" x2="490.35714285714283" y2="218" stroke="#B45F06" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="490.35714285714283" cy="160" r="5" fill="#B45F06" stroke="none" stroke-width="1.5"/><text x="490.35714285714283" y="232" font-size="13" fill="#B45F06" text-anchor="middle" font-weight="700">Glóbulo rojo (≈7 µm)</text><rect x="411.4285714285714" y="292" width="157.85714285714295" height="14" rx="3" fill="#FDF0D5" stroke="#B45F06" stroke-width="1.5"/><text x="490.35714285714283" y="328" font-size="13" fill="#B45F06" text-anchor="middle" font-weight="700">Fármaco micronizado en una suspensión: 1 – 50 µm</text><text x="360" y="358" font-size="12.5" fill="#6B7280" text-anchor="middle">Un coloide no se ve al microscopio óptico ni atraviesa una membrana semipermeable.</text></svg>
